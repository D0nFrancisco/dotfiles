# ─────────────────────────────────────────────────────────────
#  kitty · Dark Minimal
#  Recarga en caliente: ctrl+shift+F5 (o pkill -USR1 -x kitty)
# ─────────────────────────────────────────────────────────────

include dark-minimal.conf

# ── Fuente ──
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
modify_font      cell_height 112%
disable_ligatures cursor
text_composition_strategy 1.0 15

# ── Ventana ──
# La transparencia la difumina Hyprland (blur 8×3 de look.conf)
background_opacity 0.86
dynamic_background_opacity yes
window_padding_width 12 16
single_window_padding_width 14 18
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size no
initial_window_width  110c
initial_window_height 30c
draw_minimal_borders yes
window_border_width 1px
inactive_text_alpha 0.85

# ── Cursor: barra fina, parpadeo suave y estela ──
cursor_shape beam
cursor_beam_thickness 1.4
cursor_blink_interval 0.6 ease-in-out
cursor_stop_blinking_after 20
cursor_trail 3
cursor_trail_decay 0.08 0.28
cursor_trail_start_threshold 2

# ── Scroll ──
scrollback_lines 20000
wheel_scroll_multiplier 4.0
touch_scroll_multiplier 2.0
scrollbar scrolled-or-hovered
scrollbar_width 0.35
scrollbar_hover_width 0.6
scrollbar_handle_opacity 0.45
scrollbar_handle_color foreground
scrollbar_radius 0.5
scrollbar_gap 0.2

# ── Pestañas: línea fina arriba, solo con 2 o más ──
tab_bar_edge top
tab_bar_style separator
tab_separator ""
tab_bar_margin_width 8
tab_bar_margin_height 6 0
tab_bar_min_tabs 2
tab_title_template " {index}  {title[:28]} "
active_tab_title_template " {index}  {title[:28]} "
active_tab_font_style bold
inactive_tab_font_style normal

# ── Enlaces y portapapeles ──
url_style curly
detect_urls yes
copy_on_select clipboard
strip_trailing_spaces smart
mouse_hide_wait 3.0

# ── Campana: destello tenue en lugar de sonido ──
enable_audio_bell no
visual_bell_duration 0.25 ease-out
window_alert_on_bell yes

# ── Respuesta (180 Hz) ──
repaint_delay 5
input_delay 1
sync_to_monitor yes

# ── Integración con fish ──
shell_integration enabled
