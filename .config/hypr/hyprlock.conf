# ─────────────────────────────────────────────────────────────
#  HYPRLOCK · Dark Minimal  (hyprlock 0.9+, formato hyprlang)
# ─────────────────────────────────────────────────────────────
# Captura del escritorio con blur y oscurecida, reloj grande,
# campo de contraseña carbón que aparece al escribir.
# Esc / Ctrl+U limpian lo escrito.

$font   = JetBrainsMono Nerd Font
$fg     = rgb(d6d3cd)
$muted  = rgb(6e6c69)
$accent = rgba(d9d4c7cc)
$alert  = rgb(a15c5c)

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

# ─────────── Animaciones ───────────
animations {
    enabled = true

    bezier = quint,  0.22, 1,   0.36, 1
    bezier = smooth, 0.25, 0.1, 0.25, 1

    animation = fadeIn,           1, 4, quint
    animation = fadeOut,          1, 3, quint
    animation = inputFieldFade,   1, 3, smooth
    animation = inputFieldWidth,  1, 3, quint
    animation = inputFieldColors, 1, 4, smooth
    animation = inputFieldDots,   1, 2, quint
}

# ─────────── Fondo ───────────
background {
    monitor =
    path = screenshot
    color = rgb(0a0a0b)

    blur_size = 8
    blur_passes = 3
    noise = 0.015
    contrast = 0.95
    brightness = 0.55
    vibrancy = 0.1
    vibrancy_darkness = 0.1
}

# ─────────── Hora ───────────
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = $font

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(000000aa)

    position = 0, 150
    halign = center
    valign = center
}

# ─────────── Fecha ───────────
label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B"
    color = $muted
    font_size = 14
    font_family = $font

    position = 0, 70
    halign = center
    valign = center
}

# ─────────── Contraseña ───────────
# Oculto mientras está vacío; aparece con fade al escribir.
input-field {
    monitor =
    size = 280, 44
    rounding = 10
    outline_thickness = 1

    inner_color = rgba(111113d9)
    outer_color = rgba(232327ff)
    check_color = $accent
    fail_color = $alert
    capslock_color = $alert
    font_color = $fg
    font_family = $font

    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true

    fade_on_empty = true
    fade_timeout = 1500

    placeholder_text = <span foreground="##6e6c69">Contraseña</span>
    fail_text = <span foreground="##a15c5c">$FAIL ($ATTEMPTS)</span>

    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00000088)

    position = 0, -30
    halign = center
    valign = center
}

# ─────────── Usuario ───────────
label {
    monitor =
    text = 󰌾  $USER
    color = $muted
    font_size = 12
    font_family = $font

    position = 0, 40
    halign = center
    valign = bottom
}
