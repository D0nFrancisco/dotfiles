# ─────────────────────────────────────────────────────────────
#  HYPRIDLE · Dark Minimal  (hypridle 0.1.8+)
# ─────────────────────────────────────────────────────────────
# 5 min sin actividad → bloqueo · 5:30 → monitor apagado (con fade).
# Juegos y video en pantalla completa lo inhiben (regla idle_inhibit).

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Bloqueo
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Apagar monitor
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Suspender a los 60 min (desactivado: cortaría descargas de Steam).
# Para activarlo, descomenta el bloque.
# listener {
#     timeout = 3600
#     on-timeout = systemctl suspend
# }
