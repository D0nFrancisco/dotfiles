# ─────────────────────────────────────────────────────────────
#  Reglas de ventanas y capas · sintaxis de bloques (≥ 0.53)
#  Se evalúan de arriba a abajo. Reglas de juegos: gaming.conf
# ─────────────────────────────────────────────────────────────

# ── Globales ─────────────────────────────────────────────────
windowrule {
    name = no-maximize-requests
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = idle-fullscreen
    match:class = .*
    idle_inhibit = fullscreen
}

# ── Workspaces fijos (silent: no roban el foco) ──────────────
windowrule {
    name = ws3-steam
    match:class = ^(steam)$
    workspace = 3 silent
}

windowrule {
    name = ws4-chat
    match:class = ^(discord|vesktop|WebCord)$
    workspace = 4 silent
}

windowrule {
    name = ws5-music
    match:class = ^(spotify|Spotify)$
    workspace = 5 silent
}

# ── Utilidades flotantes ─────────────────────────────────────
windowrule {
    name = float-utils
    match:class = ^(org\.pulseaudio\.pavucontrol|pavucontrol|nm-connection-editor|blueman-manager|\.blueman-manager-wrapped)$
    float = on
    center = on
    size = 860 560
}

windowrule {
    name = float-dialogs
    match:title = ^(Open File|Open Folder|Save As|Save File|Abrir archivo|Abrir carpeta|Guardar como|Guardar archivo).*$
    float = on
    center = on
    size = 920 600
}

windowrule {
    name = polkit
    match:class = ^(hyprpolkitagent|org\.hyprland\.polkitagent)$
    float = on
    center = on
    dim_around = on
}

windowrule {
    name = pip
    match:title = ^(Picture-in-Picture|Picture in picture|Imagen en imagen)$
    float = on
    pin = on
    size = 480 270
    keep_aspect_ratio = on
    no_dim = on
}

windowrule {
    name = steam-toasts
    match:class = ^(steam)$
    match:title = ^(notificationtoasts.*)$
    no_initial_focus = on
    no_anim = on
}

# ── Capas ────────────────────────────────────────────────────
layerrule {
    name = waybar
    match:namespace = ^(waybar)$
    blur = on
    blur_popups = on
    ignore_alpha = 0.2
    animation = slide top
}

layerrule {
    name = rofi
    match:namespace = ^(rofi)$
    blur = on
    ignore_alpha = 0.3
    dim_around = on
    animation = popin
}

layerrule {
    name = swaync
    match:namespace = ^(swaync-control-center|swaync-notification-window)$
    blur = on
    ignore_alpha = 0.3
    animation = slide right
}

layerrule {
    name = wlogout
    match:namespace = ^(logout_dialog)$
    blur = on
    animation = fade
}

layerrule {
    name = pickers
    match:namespace = ^(selection|hyprpicker)$
    no_anim = on
}
