# ─────────────────────────────────────────────────────────────
#  Juegos y pantalla completa · latencia mínima
#  - tearing en juegos a pantalla completa (immediate)
#  - direct scanout automático
#  - el borde deja de girar mientras hay una ventana en fullscreen
# ─────────────────────────────────────────────────────────────

general {
    allow_tearing = true
}

render {
    direct_scanout = 2        # 2 = solo para contenido tipo juego
}

windowrule {
    name = games
    match:class = ^(steam_app_\d+|gamescope|cs2|Minecraft.*|org\.prismlauncher\.PrismLauncher)$
    immediate = on
    no_blur = on
    no_shadow = on
    no_dim = on
    idle_inhibit = focus
}

# Pausa el borderangle loop con fullscreen y lo reanuda al salir
exec-once = ~/.config/hypr/scripts/dm-fullscreen.sh
