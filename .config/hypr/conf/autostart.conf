# ─────────── Autostart ───────────

# Shell
exec-once = waybar
exec-once = swaync
exec-once = systemctl --user start hyprpolkitagent
exec-once = blueman-applet

# Portapapeles
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Fondo + inactividad
# [dm-videowall] exec-once = bash ~/.config/hypr/scripts/wallpaper_daemon.sh
exec-once = hypridle

# Apps GTK: modo oscuro, mismo cursor e íconos
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Classic'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'

# Fondo animado (mpvpaper): video al azar en cada inicio
exec-once = bash ~/.config/hypr/scripts/dm-videowall.sh
