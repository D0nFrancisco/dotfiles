# ─────────────────────────────────────────────────────────────
#  Animaciones · fluidas, rebote mínimo
#  SPEED en decisegundos (1 = 100 ms)
# ─────────────────────────────────────────────────────────────

animations {
    enabled = true
}

# Curvas
bezier = dmGlide,  0.22, 1.00, 0.36, 1.00    # ease-out quint: movimiento principal
bezier = dmSoft,   0.34, 1.06, 0.64, 1.00    # overshoot de 6 %: apertura elegante
bezier = dmExit,   0.55, 0.00, 0.85, 0.35    # ease-in: salidas rápidas y limpias
bezier = dmFade,   0.33, 0.00, 0.20, 1.00
bezier = dmLinear, 0.00, 0.00, 1.00, 1.00

# Ventanas
animation = windowsIn,   1, 4.5, dmSoft,  popin 86%
animation = windowsOut,  1, 2.8, dmExit,  popin 90%
animation = windowsMove, 1, 4.0, dmGlide, slide

# Fundidos
animation = fadeIn,      1, 3.0, dmFade
animation = fadeOut,     1, 2.4, dmFade
animation = fadeSwitch,  1, 3.0, dmFade
animation = fadeShadow,  1, 3.0, dmFade
animation = fadeDim,     1, 3.5, dmFade

# Borde: cambio de color + giro continuo (10 s por vuelta)
animation = border,      1, 4.0, dmGlide
animation = borderangle, 1, 100, dmLinear, loop

# Capas (waybar, rofi, swaync y wlogout tienen estilo propio en windowrules.conf)
animation = layersIn,     1, 3.5, dmSoft, popin
animation = layersOut,    1, 2.2, dmExit, fade
animation = fadeLayersIn,  1, 3.0, dmFade
animation = fadeLayersOut, 1, 2.2, dmFade

# Workspaces
animation = workspaces,       1, 4.5, dmGlide, slidefade 14%
animation = specialWorkspace, 1, 4.0, dmSoft,  slidefadevert 18%
